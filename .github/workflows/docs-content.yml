name: Docs content

on:
  push:
    branches:
      - 'docs/**'
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs-content.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs-content.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:scripts
      - name: Check portable documentation
        run: node scripts/check-docs-content.ts --root docs --expected-docs 20 --expected-nav 5
